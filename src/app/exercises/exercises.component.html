<section>
  <h2>Übungen</h2>

  <form (ngSubmit)="addExercise()">
    <input type="text" name="name" placeholder="Name" [(ngModel)]="name" required />
    <input type="text" name="category" placeholder="Kategorie" [(ngModel)]="category" />
    <button type="submit">Hinzufügen</button>
  </form>

  @if (exercises.length === 0) {
    <p>Noch keine Übungen vorhanden.</p>
  } @else {
    <ul>
      @for (exercise of exercises; track exercise.id) {
        <li>
          <strong>{{ exercise.name }}</strong>
          @if (exercise.category) {
            <span> ({{ exercise.category }})</span>
          }
          <button type="button" (click)="deleteExercise(exercise.id)">Löschen</button>
        </li>
      }
    </ul>
  }
</section>
