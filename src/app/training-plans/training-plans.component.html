<h2>Trainingspläne</h2>

<mat-card>
  <mat-card-content>
    <form class="entry-form" (ngSubmit)="addPlan()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput name="name" [(ngModel)]="name" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Beschreibung</mat-label>
        <input matInput name="description" [(ngModel)]="description" />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">Hinzufügen</button>
    </form>
  </mat-card-content>
</mat-card>

@if (plans.length === 0) {
  <p>Noch keine Trainingspläne vorhanden.</p>
} @else {
  <mat-list>
    @for (plan of plans; track plan.id) {
      <mat-list-item>
        <span matListItemTitle>{{ plan.name }}</span>
        @if (plan.description) {
          <span matListItemLine>{{ plan.description }}</span>
        }
        <button mat-icon-button color="warn" (click)="deletePlan(plan.id)" aria-label="Löschen">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
    }
  </mat-list>
}
