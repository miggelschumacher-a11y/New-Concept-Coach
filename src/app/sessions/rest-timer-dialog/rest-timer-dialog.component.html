<div class="rest-timer-content" (click)="close()">
  <svg class="rest-timer-ring" viewBox="0 0 64 64">
    <circle class="rest-timer-ring-track" cx="32" cy="32" r="28" />
    <circle
      class="rest-timer-ring-progress"
      cx="32"
      cy="32"
      r="28"
      [style.stroke-dasharray]="ringCircumference"
      [style.stroke-dashoffset]="ringDashOffset"
    />
  </svg>
  @if (data.feedbackMessage) {
    <p class="rest-timer-feedback">{{ data.feedbackMessage }}</p>
  }
  <p class="rest-timer-elapsed">{{ 'sessions.restTimerLabel' | translate }}: {{ elapsedSeconds }} {{ 'sessions.secondsField' | translate }}</p>
  <p class="rest-timer-hint">{{ 'sessions.restTimerDismissHint' | translate }}</p>
</div>
