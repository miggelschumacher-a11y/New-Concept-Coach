<div class="rest-timer-content" cdkDrag cdkDragBoundary="body">
  <button
    mat-icon-button
    type="button"
    class="rest-timer-close"
    (click)="close()"
    [matTooltip]="'sessions.closeButton' | translate"
    [attr.aria-label]="'sessions.closeButton' | translate"
  >
    <mat-icon>close</mat-icon>
  </button>
  <svg
    class="rest-timer-ring"
    [class.rest-timer-pulse]="pulsing"
    [class.rest-timer-ring-second-phase]="isSecondPhase"
    viewBox="0 0 64 64"
  >
    <circle class="rest-timer-ring-track" cx="32" cy="32" r="28" />
    <circle
      class="rest-timer-ring-progress"
      cx="32"
      cy="32"
      r="28"
      [style.stroke-dasharray]="ringCircumference"
      [style.stroke-dashoffset]="ringDashOffset"
    />
  </svg>
  @if (data.feedbackMessage) {
    <p class="rest-timer-feedback">{{ data.feedbackMessage }}</p>
  }
  <p class="rest-timer-elapsed" [class.rest-timer-pulse]="pulsing">
    {{ (hasSecondThreshold ? (isSecondPhase ? 'config.secondRestAfterSetLabel' : 'config.firstRestAfterSetLabel') : 'sessions.restTimerLabel') | translate }}:
    {{ elapsedSeconds | duration }} / {{ activeThresholdSeconds | duration }}
  </p>
</div>
