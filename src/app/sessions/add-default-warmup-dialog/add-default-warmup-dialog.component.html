<h2 mat-dialog-title>{{ 'sessions.addDefaultRampTitle' | translate }}</h2>
<div mat-dialog-content>
  <p class="add-default-warmup-intro">{{ 'sessions.addDefaultRampIntro' | translate }}</p>
  @for (row of data.rows; track row.exerciseId + row.kind) {
    <mat-checkbox [(ngModel)]="row.selected" name="addDefaultWarmup-{{ row.exerciseId }}-{{ row.kind }}">
      <mat-icon class="label-icon">{{ row.kind === 'warmup' ? 'whatshot' : 'ac_unit' }}</mat-icon>{{ row.exerciseName }}
    </mat-checkbox>
  }
</div>
<div mat-dialog-actions class="add-default-warmup-actions">
  <button mat-stroked-button type="button" (click)="skip()">{{ 'sessions.confirmCancel' | translate }}</button>
  <button mat-raised-button color="primary" type="button" (click)="confirm()">{{ 'common.add' | translate }}</button>
</div>
