<h2>Trainingseinheiten</h2>

<mat-card>
  <mat-card-content>
    <form class="entry-form" (ngSubmit)="addSession()">
      <mat-form-field appearance="outline">
        <mat-label>Datum</mat-label>
        <input matInput type="date" name="date" [(ngModel)]="date" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Notizen</mat-label>
        <input matInput name="notes" [(ngModel)]="notes" />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">Hinzufügen</button>
    </form>
  </mat-card-content>
</mat-card>

@if (sessions.length === 0) {
  <p>Noch keine Trainingseinheiten vorhanden.</p>
} @else {
  <mat-list>
    @for (session of sessions; track session.id) {
      <mat-list-item>
        <span matListItemTitle>{{ session.date }}</span>
        @if (session.notes) {
          <span matListItemLine>{{ session.notes }}</span>
        }
        <button mat-icon-button color="warn" (click)="deleteSession(session.id)" aria-label="Löschen">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
    }
  </mat-list>
}
