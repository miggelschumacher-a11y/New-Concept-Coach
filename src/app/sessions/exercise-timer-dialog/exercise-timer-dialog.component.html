<div class="exercise-timer-content">
  @if (data.countdown.hasTarget) {
    <svg class="exercise-timer-ring" [class.exercise-timer-pulse]="pulsing" viewBox="0 0 64 64">
      <circle class="exercise-timer-ring-track" cx="32" cy="32" r="28" />
      <circle
        class="exercise-timer-ring-progress"
        cx="32"
        cy="32"
        r="28"
        [style.stroke-dasharray]="ringCircumference"
        [style.stroke-dashoffset]="ringDashOffset"
      />
    </svg>
  }
  <p class="exercise-timer-elapsed" [class.exercise-timer-pulse]="pulsing">
    @if (data.countdown.hasTarget) {
      {{ 'sessions.exerciseTimerLabel' | translate }}: {{ elapsedSeconds | duration }} / {{ data.countdown.targetSeconds | duration }}
    } @else {
      {{ 'sessions.exerciseTimerLabel' | translate }}: {{ elapsedSeconds | duration }}
    }
  </p>
  <div class="exercise-timer-actions">
    <button mat-stroked-button type="button" (click)="data.stopCountdown()">
      {{ 'sessions.stopCountdownButton' | translate }}
    </button>
    <button mat-flat-button color="primary" type="button" (click)="data.finishSet()">
      {{ 'sessions.completeSet' | translate }}
    </button>
  </div>
</div>
