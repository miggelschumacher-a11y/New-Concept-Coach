<h2>Konfiguration</h2>

<mat-card>
  <mat-card-header>
    <mat-card-title>Anzeige</mat-card-title>
  </mat-card-header>
  <mat-card-content class="settings-form">
    <mat-form-field appearance="outline">
      <mat-label>Gewichtseinheit</mat-label>
      <mat-select [(ngModel)]="weightUnit" (selectionChange)="onWeightUnitChange()">
        <mat-option value="kg">kg</mat-option>
        <mat-option value="lbs">lbs</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Datumsformat</mat-label>
      <mat-select [(ngModel)]="dateFormat" (selectionChange)="onDateFormatChange()">
        <mat-option value="dd.MM.yyyy">TT.MM.JJJJ (21.08.2026)</mat-option>
        <mat-option value="MM/dd/yyyy">MM/TT/JJJJ (08/21/2026)</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Daten</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Exportiere alle lokalen Daten als Datei oder stelle eine zuvor exportierte Sicherung wieder her.</p>

    <div class="data-actions">
      <button mat-stroked-button type="button" (click)="exportData()">Daten exportieren</button>

      <button mat-stroked-button type="button" (click)="fileInput.click()">Daten importieren</button>
      <input #fileInput type="file" accept="application/json" hidden (change)="importData($event)" />

      <button mat-stroked-button color="warn" type="button" (click)="resetData()">Alle Daten löschen</button>
    </div>

    @if (statusMessage) {
      <p class="status-message">{{ statusMessage }}</p>
    }
  </mat-card-content>
</mat-card>
