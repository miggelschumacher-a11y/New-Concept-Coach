<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Concept Coach</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Roboto and the Material Icons font are bundled locally (see the
       "styles" array in angular.json) rather than pulled from
       fonts.googleapis.com, so the app renders fully offline and makes no
       network request to Google on startup. Google Identity Services is
       likewise not loaded here - GoogleDriveService.ensureGisLoaded()
       injects that script on demand, the first time the user actually
       starts a Drive backup. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e63312">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CoCo">
</head>

</body>
</html>
